[build-system]
requires = [
  "setuptools>=68",
  "wheel",
  "pybind11>=2.13,<3"
]
build-backend = "setuptools.build_meta"

[project]
name = "lopus-ai"
version = "0.5.0"
description = "Projeto experimental de agente de IA local e modular."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Joao Pedro Rodrigues Viana" }
]
dependencies = [
  "nicegui[native]>=3.17,<4"
]

[project.optional-dependencies]
vision = [
  "rapidocr>=3.10,<4"
]

[project.scripts]
lopus = "lopus.app:main"
lopus-cli = "lopus.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

name: Native Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install Lopus-AI
        run: python -m pip install -e .

      - name: Verify native module
        run: python -c "import lopus_native; print(lopus_native.platform_name(), lopus_native.process_id())"

      - name: Run tests
        run: python -m unittest discover -s tests -v
